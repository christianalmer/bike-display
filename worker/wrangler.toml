name = "baywheels-trends"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Serve the trends page from a plain .html file imported as text
rules = [{ type = "Text", globs = ["**/*.html"], fallthrough = true }]

# Poll GBFS once a minute (matches the feed's ~30-60s update cadence)
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "baywheels"
database_id = "9756cf4b-ac42-4a56-9f5a-4ccb21e3bd14"

[observability]
enabled = true
