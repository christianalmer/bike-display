name = "baywheels-trends"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Serve the trends page from a plain .html file imported as text
rules = [{ type = "Text", globs = ["**/*.html"], fallthrough = true }]

# The real 1-min scheduler is a Durable Object alarm (Scheduler class) —
# account crons proved unreliable (silent multi-hour stalls). The cron stays
# only as a backstop that re-arms the alarm if it ever gets lost.
[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "SCHEDULER"
class_name = "Scheduler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Scheduler"]

[[d1_databases]]
binding = "DB"
database_name = "baywheels"
database_id = "9756cf4b-ac42-4a56-9f5a-4ccb21e3bd14"

[observability]
enabled = true
